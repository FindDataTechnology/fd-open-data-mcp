apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: coverage-expander
  name: coverage-expander
  namespace: fd-master
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata: {}
    spec:
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - python
            - -m
            - fd_open_data_mcp.coverage.expander
            env:
            - name: DC_API_KEY
              valueFrom:
                secretKeyRef:
                  key: DC_API_KEY
                  name: dc-api-key
            - name: FD_OPEN_DATA_MCP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: fd-db-secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  key: REDIS_URL
                  name: fd-db-secret
            - name: RECONCILER_LAUNCHER
              value: k8s-multi
            - name: SCRAW_K8S_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: fd-db-secret
            - name: SCRAW_K8S_REDIS_URL
              valueFrom:
                secretKeyRef:
                  key: REDIS_URL
                  name: fd-db-secret
            - name: KUBECONFIG_DIR
              value: /kubeconfigs
            - name: POLICY_MAX_FETCHES
              value: '50000'
            - name: COVERAGE_MAX_WAVE_POLICIES
              value: '16'
            - name: COVERAGE_MAX_ACTIVE_WAVES
              value: '6'
            - name: COVERAGE_TARGET_CELLS
              value: '8000'
            - name: COVERAGE_PAUSE_FRACTION
              value: '0.3'
            - name: COVERAGE_MAX_PAUSED_GROUPS
              value: '5'
            - name: COVERAGE_BACKFILL_DAYS
