# Proactive alert before a bound worker credential expires.
#
# WHY THIS EXISTS
# ---------------
# On 2026-11-11 cheap's dispatch credential was switched from a non-expiring legacy
# SA token to a bound token with a 720h (30d) lifetime. Bound is the right shape —
# a leaked credential dies on its own — but it introduces a **silent** failure mode:
# if the refresh never runs, dispatch starts returning 401 on the expiry day with no
# prior signal. `scripts/check_worker_credential_surface.py` can compute "remaining
# life < 1/3", but nobody runs a script by hand every day.
#
# This CronJob is that line of sight. It reads the mounted credential, reuses the
# existing lifetime judgement and the existing notification transport (ServerChan /
# WeChat, credential already in `crawl-watcher-secret`), and pushes only when there
# is something to act on. Healthy runs exit 0 and notify nobody.
#
# WHAT IT DOES NOT DO
# -------------------
# It never refreshes anything — refreshing needs `create serviceaccounts/token`, which
# the control plane's credential deliberately lacks (see
# `.github/workflows/refresh-worker-credentials.yml` for where minting happens instead).
#
# THE MOUNTED SCRIPT
# ------------------
# ConfigMap `credential-alert-scripts` is generated from the repo, not hand-written:
#   kubectl --context xinru -n fd-master create configmap credential-alert-scripts \
#     --from-file=scripts/alert_stale_credentials.py \
#     --from-file=scripts/check_worker_credential_surface.py \
#     --dry-run=client -o yaml | kubectl --context xinru -n fd-master apply -f -
#
# !! ORDER MATTERS SINCE 2026-11-11 !!  The scripts now import the expiry judgement
# from `fd_open_data_mcp.visibility.credentials`, which only exists in the package
# from 0.5.62 on. Regenerating this ConfigMap against an image that predates 0.5.62
# turns the job into an ImportError — i.e. it silently disarms the very alert it
# exists to send. The scripts print a named error saying so, but the safe order is:
#   1. ship an image >= 0.5.62, 2. regenerate this ConfigMap, 3. re-run the job once
# and confirm it prints "OK 没有到期风险".
#
# AFTER 0.5.62 IS LIVE, RETIRE THIS CRONJOB. `crawl-watcher-scan` checks the same
# credential every 15 minutes (see `fd_open_data_mcp/visibility/scan.py`), shares one
# dedup set and one notification channel with the failure alerts, and needs no
# ConfigMap at all — so this job becomes a second, unmonitored copy of that logic.
# Retirement:
#   kubectl --context xinru -n fd-master delete cronjob worker-credential-expiry
#   kubectl --context xinru -n fd-master delete configmap credential-alert-scripts
#   then delete this file and scripts/alert_stale_credentials.py from the repo
# (scripts/check_worker_credential_surface.py stays — it is the offline audit tool.)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-credential-expiry
  namespace: fd-master
  labels:
    app: worker-credential-expiry
spec:
  schedule: '0 1 * * *'          # daily 01:00 UTC — a 10-day runway needs no finer
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: worker-credential-expiry
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: fd-harbor-pull
          containers:
            - name: alert
              # Same image as the reconciler: it already carries
              # fd_open_data_mcp.visibility.notifiers and is cached on the node.
              image: ccr.ccs.tencentyun.com/finddata/scraw-fd-open-data-mcp:sha-5539dc5
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /opt/credential-alert/alert_stale_credentials.py
                - --kubeconfigs-dir
                - /kubeconfigs
              env:
                - name: SCRAW_NOTIFIER
                  value: wechat
                - name: SCRAW_WATCHER_SCT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: crawl-watcher-secret
                      key: SCRAW_WATCHER_SCT_TOKEN
                - name: PYTHONUNBUFFERED
                  value: '1'
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: kubeconfigs
                  mountPath: /kubeconfigs
                  readOnly: true
                - name: scripts
                  mountPath: /opt/credential-alert
                  readOnly: true
          volumes:
            - name: kubeconfigs
              secret:
                secretName: worker-kubeconfigs
            - name: scripts
              configMap:
                name: credential-alert-scripts
