# CANONICAL RECORD of the fd-master/crawl-watcher-scan CronJob — generated from the LIVE
# object on 2026-11-11 (kube context xinru). Like its siblings this CronJob was
# applied ad hoc and no repo tracked it, so the object's own
# `last-applied-configuration` annotation is the only other record — and it is
# STALE (it still names a retired registry / older image). Re-applying from that
# annotation would silently roll this CronJob back.
#
# Regenerate / check for drift:
#   kubectl --context xinru -n fd-master get cronjob crawl-watcher-scan -o yaml
#   # diff the `spec` block against this file
#
# Secret values are references only (secretKeyRef / secret volume) — nothing sensitive
# is inlined.
#
# `worker-kubeconfigs` is mounted READ-ONLY at /kubeconfigs so this tick can also
# check worker credential expiry (rotate-worker-cluster-credentials 3.2). It carries
# the same tokens the control plane already holds; the scan only reads their JWT
# `exp` claim and never touches a cluster. Without the mount the tick still works —
# it just skips that one check ("not mounted" is a deployment shape, not a risk).
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: crawl-watcher
    component: scan
  name: crawl-watcher-scan
  namespace: fd-master
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: {}
    spec:
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - python
            - -m
            - fd_open_data_mcp.visibility.scan
            env:
            - name: FD_OPEN_DATA_MCP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: fd-db-secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  key: REDIS_URL
                  name: fd-db-secret
            - name: SCRAW_NOTIFIER
              value: wechat
            - name: SCRAW_WATCHER_SCT_TOKEN
              valueFrom:
                secretKeyRef:
                  key: SCRAW_WATCHER_SCT_TOKEN
                  name: crawl-watcher-secret
            - name: SCRAW_STALE_MINUTES
              value: '90'
            - name: SCRAW_KUBECONFIGS_DIR
              value: /kubeconfigs
            - name: PYTHONUNBUFFERED
              value: '1'
            # 0.5.62 起这个 CronJob 用本仓的镜像：`python -m fd_open_data_mcp.visibility.scan`
# 的入口、依赖与 schema 闸都在本仓镜像里（2026-11-12 实测：换过去后
# credentials_checked=true，schema gate 报 0023）。
            image: ccr.ccs.tencentyun.com/finddata/fd-open-data-mcp:sha-9678e95
            imagePullPolicy: IfNotPresent
            name: watcher-scan
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /kubeconfigs
              name: kubeconfigs
              readOnly: true
          dnsPolicy: ClusterFirst
          imagePullSecrets:
          - name: fd-harbor-pull
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
          - name: kubeconfigs
            secret:
              secretName: worker-kubeconfigs
  schedule: 10,25,40,55 * * * *
  successfulJobsHistoryLimit: 3
  suspend: false
