# fd-open-data-mcp MCP server — Streamable HTTP :8300, env-gated bearer auth
# (MCP_BEARER_TOKEN from the fd-mcp-env Secret). Serves ontology reads from the
# canonical PG on guangzhou-xinru: FD_OPEN_DATA_MCP_DATABASE_URL and REDIS_URL
# come from the Secret via envFrom. This pod serves reads only; it does not
# crawl, so the fd-proxy-service forwarder / proxy pool does not apply here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-open-data-mcp
  namespace: fd-mcp
  labels:
    app.kubernetes.io/name: fd-open-data-mcp
    app.kubernetes.io/part-of: finddata
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-open-data-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-open-data-mcp
        app.kubernetes.io/part-of: finddata
    spec:
      containers:
        - name: fd-open-data-mcp
          # Pinned to the <short-sha> tag pushed by .github/workflows/
          # docker-publish.yml for commit 57cbe29 — wires the cache read
          # path to the semantic_observations_read dedup view (FDW-backed
          # shard rows become visible) + historical-aware is_stale (past
          # periods are immutable facts → no re-fetch).
          image: harbor.local/finddata/fd-open-data-mcp:sha-57cbe29
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp
              containerPort: 8300
          envFrom:
            - secretRef:
                name: fd-mcp-env
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fd-open-data-mcp
  namespace: fd-mcp
  labels:
    app.kubernetes.io/name: fd-open-data-mcp
    app.kubernetes.io/part-of: finddata
spec:
  # NodePort (not ClusterIP): LibreChat lives on a DIFFERENT cluster (chengsi
  # k3s); the mesh reaches this node, not this cluster's service network.
  # Endpoint over the mesh: http://100.64.0.4:30801/mcp
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-open-data-mcp
  ports:
    - name: mcp
      port: 8300
      targetPort: mcp
      nodePort: 30801
