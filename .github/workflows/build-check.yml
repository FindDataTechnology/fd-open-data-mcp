name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

  # db-schema-lifecycle 4.5 + 6.5: catch model drift and vocabulary drift.
  # 2026-09-16 incident root cause, other half: models changed with no
  # revision ever noticing. `alembic check` compares the migrated empty
  # database against Base.metadata — a model change without a matching
  # revision fails here. The vocabulary step pins DB content naming to
  # fd-open-data-protocol (design D8): every concepts.concept_code must
  # resolve to a protocol concept family id.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the vector migration (0004, semantic-search) runs
        # CREATE EXTENSION vector — vanilla postgres:14 fails with "could not
        # open extension control file vector.control" (6+ red runs through
        # 2026-10-01).
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: fdtest
          POSTGRES_DB: fd_schema_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fdtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FD_OPEN_DATA_MCP_DATABASE_URL: postgresql+psycopg2://fdtest@localhost:5432/fd_schema_ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # 0003's registry_indicator_embeddings DDL carries a hard FK to
      # registry_entries, which the registry pipeline — not this chain —
      # creates (its own comment: "deliberately not created here"). The
      # authoritative database has it before migrations run; an empty CI
      # database must mirror that precondition.
      - name: Bootstrap registry-pipeline precondition
        run: |
          python - <<'EOF'
          import os
          import psycopg2
          url = os.environ["FD_OPEN_DATA_MCP_DATABASE_URL"].replace("+psycopg2", "")
          conn = psycopg2.connect(url)
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute("""
              CREATE TABLE IF NOT EXISTS registry_entries (
                id BIGSERIAL PRIMARY KEY,
                source_db TEXT NOT NULL, source_table TEXT NOT NULL,
                source_column TEXT NOT NULL DEFAULT '', native_code TEXT NOT NULL,
                semantic_code TEXT, name_zh TEXT, name_en TEXT, unit TEXT,
                frequency TEXT, domain TEXT, provenance JSONB,
                verified BOOLEAN NOT NULL DEFAULT false, verified_by TEXT,
                registered_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                CONSTRAINT uq_registry_anchor
                  UNIQUE (source_db, source_table, source_column, native_code))
          """)
          cur.execute("""
              CREATE UNIQUE INDEX IF NOT EXISTS uq_registry_semantic_code
              ON registry_entries (semantic_code) WHERE semantic_code IS NOT NULL
          """)
          print("registry_entries precondition ready")
          EOF

      - name: Migrate empty database to head
        run: alembic upgrade head

      - name: Fail on model/revision drift (alembic check)
        run: alembic check

      - name: Vocabulary conformance (empty migrated DB must pass)
        run: python scripts/check_vocabulary_conformance.py

      - name: Vocabulary conformance tests
        run: pytest tests/test_vocabulary_conformance.py -v
