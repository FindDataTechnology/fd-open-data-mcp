# Refresh the worker-cluster dispatch credential on a schedule.
#
# WHY THIS RUNS HERE, NOT AS A CRONJOB IN THE CONTROL PLANE
# ---------------------------------------------------------
# Minting a bound token is `POST .../serviceaccounts/crawl-worker/token`, which needs
# `create serviceaccounts/token` on the worker cluster. The control plane's only
# worker credential is `crawl-worker` itself, and it explicitly lacks that verb
# (measured 2026-11-11: `auth can-i create serviceaccounts/token --as=.../crawl-worker`
# -> no; create/delete/get jobs -> yes). Minting from inside the control plane would
# therefore require adding a NEW standing credential with minting power — and that
# credential would itself need refreshing, which is the same problem one level up.
#
# So the minting happens out-of-cluster, with the admin kubeconfig that already
# exists for operations, and only the resulting token is written into the control
# plane's `worker-kubeconfigs` Secret. The control plane keeps exactly one
# low-privilege credential.
#
# The price: if this workflow stops, tokens expire silently. That price is paid by
# `scripts/check_worker_credential_surface.py`, whose bound-token branch goes STALE
# once remaining life drops below 1/3 — i.e. one refresh interval of warning before
# dispatch starts failing.
#
# Cadence vs lifetime is enforced by scripts/check_credential_refresh_ratio.py,
# which reads the cron below and the `--duration` default in
# scripts/rotate_worker_credential.py and asserts interval * 3 <= duration.

name: refresh-worker-credentials

on:
  schedule:
    # Weekly, Monday 03:17 UTC. With the 720h (30d) token lifetime this gives
    # ratio 4.3 — one missed run still leaves ~23 days, two missed runs ~16.
    # Do not widen this without re-running check_credential_refresh_ratio.py.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'token 形态'
        type: choice
        options: [bound, legacy]
        default: bound
      dry_run:
        description: '只打印计划（不写回）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: refresh-worker-credentials
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The admin kubeconfigs for the worker clusters + the control plane. Stored as
      # a repo secret because this is the ONLY place that holds minting rights.
      # Never mount these into the cluster.
      - name: Materialise kubeconfigs
        env:
          KUBECONFIGS: ${{ secrets.WORKER_ADMIN_KUBECONFIGS }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIGS" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.4'

      - name: Refresh every enabled cluster
        env:
          MODE: ${{ inputs.mode || 'bound' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          python3 scripts/check_credential_refresh_ratio.py
          # Cluster list comes from the control plane DB, so a disabled cluster is
          # never refreshed and an enabled one can never be forgotten.
          clusters=$(kubectl --context cheap-ts -n fd-master exec \
            deploy/crawl-control -- python3 -c \
            "import os;from sqlalchemy import create_engine,text;\
print(' '.join(r[0] for r in create_engine(os.environ['FD_OPEN_DATA_MCP_DATABASE_URL'])\
.connect().execute(text(\"select name from clusters where enabled order by name\"))))" \
            2>/dev/null || true)
          if [ -z "${clusters:-}" ]; then
            echo "::error::拿不到 enabled 集群清单（不猜，直接失败）"
            exit 1
          fi
          for c in $clusters; do
            echo "== $c"
            if [ "$DRY_RUN" = "true" ]; then
              python3 scripts/rotate_worker_credential.py --cluster "$c" --mode "$MODE" --dry-run
            else
              python3 scripts/rotate_worker_credential.py --cluster "$c" --mode "$MODE" --apply
            fi
          done

      - name: Report remaining lifetime
        if: always()
        run: |
          # Non-fatal: this is the visibility step (3.2). It names what still has
          # runway and what is about to expire, using the mounted Secret only.
          python3 scripts/check_worker_credential_surface.py --report-only || true
