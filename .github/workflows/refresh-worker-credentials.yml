# Refresh the worker-cluster dispatch credential on a schedule.
#
# WHY THIS RUNS OUTSIDE THE CONTROL PLANE
# ---------------------------------------
# Minting a bound token is POST .../serviceaccounts/crawl-worker/token, which needs
# `create serviceaccounts/token` on the worker cluster. The control plane's only worker
# credential is `crawl-worker` itself and it explicitly lacks that verb (measured
# 2026-11-11: `auth can-i create serviceaccounts/token --as=.../crawl-worker` -> no;
# create/delete/get jobs -> yes). Adding a minting credential inside the cluster would
# mean that credential needs refreshing too — the same problem one level up, plus a
# stronger long-lived secret. So minting happens here, out of cluster, and only the
# resulting token is written into the control plane's worker-kubeconfigs Secret.
#
# WHAT THIS RUNNER MUST BE
# ------------------------
# A SELF-HOSTED runner ON THE TAILNET. Both the worker API (cheap =
# https://100.64.0.13:6443) and the control plane are 100.64/10 addresses; a
# GitHub-hosted runner cannot reach them. The preflight fails loudly rather than
# letting the job die halfway through.
#
# WHAT YOU MUST PROVISION (deliberately not done by code)
# ------------------------------------------------------
#   secret WORKER_ADMIN_KUBECONFIGS = a kubeconfig with admin contexts for the worker
#     clusters (currently `cheap-ts`) and the control plane (`xinru`).
#   Uploading cluster-admin kubeconfigs into a third-party secret store is a security
#   decision, so it is left to the operator. Until it exists the preflight fails with
#   an explicit message and nothing is written.
#
# CADENCE VS LIFETIME
# -------------------
# scripts/check_credential_refresh_ratio.py reads --duration from
# scripts/rotate_worker_credential.py and the cron below, asserting interval*3 <=
# duration. Current: 720h / 168h = 4.3. Do not widen the cron without re-running it.
#
# IF THIS STOPS RUNNING
# ---------------------
# Tokens expire silently — that is the price of automatic rotation. The compensation is
# scripts/check_worker_credential_surface.py: its bound branch goes STALE once remaining
# life drops below 1/3, i.e. one refresh interval of warning before dispatch 401s.

name: refresh-worker-credentials

on:
  schedule:
    - cron: '17 3 * * 1'      # Monday 03:17 UTC -> interval 168h
  workflow_dispatch:
    inputs:
      mode:
        description: 'token 形态'
        type: choice
        options: [bound, legacy]
        default: bound
      dry_run:
        description: '只打印计划（不写回）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: refresh-worker-credentials
  cancel-in-progress: false

jobs:
  refresh:
    # Self-hosted + tailnet: worker API and control plane are 100.64/10 only.
    runs-on: [self-hosted, linux, finddata]
    steps:
      - uses: actions/checkout@v4

      - name: Preflight - runner, kubectl, credentials
        env:
          KUBECONFIGS: ${{ secrets.WORKER_ADMIN_KUBECONFIGS }}
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null || { echo "::error::runner 上没有 kubectl"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::runner 上没有 python3"; exit 1; }
          if [ -z "${KUBECONFIGS:-}" ]; then
            echo "::error::缺少 secret WORKER_ADMIN_KUBECONFIGS —— 见本文件头部 WHAT YOU MUST PROVISION。什么都不写，直接停。"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIGS" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          for c in $(kubectl config get-contexts -o name); do
            kubectl --context "$c" --request-timeout=15s get ns >/dev/null 2>&1 \
              || { echo "::error::context $c 连不上（是不是不在 tailnet 上？）"; exit 1; }
          done
          echo "preflight OK: contexts = $(kubectl config get-contexts -o name | tr '\n' ' ')"

      - name: Cadence vs lifetime gate
        run: python3 scripts/check_credential_refresh_ratio.py

      - name: Refresh every mounted cluster
        env:
          MODE: ${{ inputs.mode || 'bound' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          CONTROL_CTX: ${{ vars.WORKER_CONTROL_CONTEXT || 'xinru' }}
        run: |
          set -euo pipefail
          # 集群清单取自控制面 Secret 的 key（<name>.token）—— 这就是控制面真实的凭据面，
          # 且不需要 DB（CI 连不到 tailnet 里的 PG）。"挂载 == enabled" 由
          # check_worker_credential_surface.py 在有人有 DB 时另行核对。
          clusters=$(kubectl --context "$CONTROL_CTX" -n fd-master get secret \
              worker-kubeconfigs -o json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['data']; print(' '.join(sorted(k[:-6] for k in d if k.endswith('.token'))))")
          if [ -z "${clusters:-}" ]; then
            echo "::error::控制面 Secret 里没有 <cluster>.token（不猜，直接失败）"
            exit 1
          fi
          echo "要刷新的集群: $clusters"
          for c in $clusters; do
            echo "== $c"
            if [ "$DRY_RUN" = "true" ]; then
              python3 scripts/rotate_worker_credential.py --cluster "$c" --mode "$MODE" --dry-run
            else
              python3 scripts/rotate_worker_credential.py --cluster "$c" --mode "$MODE" --apply
            fi
          done

      - name: Report remaining lifetime
        if: always()
        run: |
          # 可见性那一步（3.2）：说明谁还有余量、谁该刷新了。失败不影响上面结论，
          # 但输出会进日志，不会无声。
          python3 scripts/check_worker_credential_surface.py --report-only || true
