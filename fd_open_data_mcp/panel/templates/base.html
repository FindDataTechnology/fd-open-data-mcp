<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}爬虫控制台 Crawl Control Center{% endblock %}</title>
  {#- apply the stored theme before first paint (design D2); no-JS clients
      fall back to prefers-color-scheme tokens in app.css -#}
  <script>(function(){try{var t=localStorage.getItem("panel-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}})();</script>
  <link rel="stylesheet" href="/panel/static/app.css">
  <link rel="icon" href="data:,">
  <script src="/panel/static/htmx.min.js" defer></script>
  <script src="/panel/static/app.js" defer></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="i-home" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-policies" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-runs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></symbol>
    <symbol id="i-proxy" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></symbol>
    <symbol id="i-data" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidenav">
      <div class="brand">fd 爬虫控制台<span class="en">CRAWL CONTROL</span></div>
      {% set path = request.url.path %}
      <nav>
        <a class="nav-link {{ 'active' if path == '/panel' }}" href="/panel"><svg><use href="#i-home"/></svg>总览 <span class="en">Home</span></a>
        <a class="nav-link {{ 'active' if path.startswith('/panel/policies') }}" href="/panel/policies"><svg><use href="#i-policies"/></svg>策略 <span class="en">Policies</span></a>
        <a class="nav-link {{ 'active' if path.startswith('/panel/runs') }}" href="/panel/runs"><svg><use href="#i-runs"/></svg>运行 <span class="en">Runs</span></a>
        <a class="nav-link {{ 'active' if path.startswith('/panel/proxy') }}" href="/panel/proxy"><svg><use href="#i-proxy"/></svg>代理 <span class="en">Proxy</span></a>
        <a class="nav-link {{ 'active' if path.startswith('/panel/data') }}" href="/panel/data"><svg><use href="#i-data"/></svg>数据 <span class="en">Data</span></a>
      </nav>
      <div class="sidenav-foot">
        <a class="nav-new" href="/panel/policies/new">＋ 新建策略 <span class="en">New</span></a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题 Toggle theme">☾</button>
        <span class="whoami" hx-get="/panel/auth/whoami" hx-trigger="load" hx-swap="innerHTML"></span>
      </div>
    </aside>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
</body>
</html>
