{% set badge = {'pending': 'no_op', 'claimed': 'running', 'done': 'success',
                'failed': 'failed', 'cancelled': 'cancelled'}.get(p.status, 'no_op') %}
  <tr>
    <td>#{{ p.id }}</td>
    <td><a href="/panel/sources/{{ p.source }}">{{ p.source }}</a></td>
    <td><span class="badge {{ badge }}">{{ p.status }}</span>
      {% if p.status in ('pending', 'claimed') %}
      <span class="confirm">
        <button type="button" class="link link-danger"
                onclick="this.closest('.confirm').classList.add('armed')">取消 cancel</button>
        <span class="confirm-arm">
          <button type="button" class="link link-danger"
                  hx-post="/panel/pending/{{ p.id }}/cancel"
                  hx-target="closest tr" hx-swap="outerHTML">确认取消 confirm</button>
          <button type="button" class="link"
                  onclick="this.closest('.confirm').classList.remove('armed')">保留 keep</button>
        </span>
      </span>
      <noscript><form class="inline-form" method="post" action="/panel/pending/{{ p.id }}/cancel"><button class="link" type="submit">取消 cancel</button></form></noscript>
      {% endif %}
    </td>
    <td class="muted">{{ p.requested_by }}</td>
    <td class="muted">{{ p.created_at or '—' }}</td>
    <td></td>
  </tr>
